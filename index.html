
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Văn 7 cùng cô Thương</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f5f0;
      color: #35443d;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 440px;
      background: white;
      padding: 34px 28px;
      border-radius: 22px;
      box-shadow: 0 8px 30px #35443d12;
    }
    .brand { text-align: center; margin-bottom: 28px; }
    .book { font-size: 42px; }
    h1 { font-size: 25px; margin: 12px 0 8px; color: #496b59; }
    .sub { color: #7c8980; font-size: 14px; line-height: 1.6; }
    label { display: block; margin: 17px 0 7px; font-size: 14px; }
    input {
      width: 100%; padding: 13px 14px; border: 1px solid #dce4dc;
      border-radius: 10px; font-size: 15px; outline: none;
    }
    input:focus { border-color: #789982; }
    button {
      width: 100%; padding: 14px; margin-top: 22px;
      background: #668a72; color: white; border: 0;
      border-radius: 10px; font-size: 16px; cursor: pointer;
    }
    button:hover { background: #52745e; }
    .message { font-size: 14px; line-height: 1.6; margin-top: 16px; }
    .welcome { text-align: center; }
    .hidden { display: none; }
    .logout { background: #e9eee9; color: #496b59; }
    .note { margin-top: 24px; font-size: 12px; color: #929b94; text-align: center; }
  </style>
</head>
<body>
  <main class="container">
    <section id="loginSection">
      <div class="brand">
        <div class="book">📚</div>
        <h1>Văn 7 cùng cô Thương</h1>
        <div class="sub">Cùng học Văn, cùng khám phá và trưởng thành.</div>
      </div>

      <form id="loginForm">
        <label for="email">Email đăng nhập</label>
        <input id="email" type="email" placeholder="Nhập email của em" required>

        <label for="password">Mật khẩu</label>
        <input id="password" type="password" placeholder="Nhập mật khẩu" required>

        <button type="submit" id="loginButton">Đăng nhập</button>
      </form>
      <div id="loginMessage" class="message"></div>
      <div class="note">Không có tài khoản? Liên hệ cô Thương để được cấp tài khoản.</div>
    </section>

    <section id="homeSection" class="hidden welcome">
      <div class="book">🌿</div>
      <h1>Chào mừng em!</h1>
      <p id="userName"></p>
      <p id="userRole" class="sub"></p>
      <div id="dashboardMessage" class="message"></div>
      <button class="logout" id="logoutButton">Đăng xuất</button>
    </section>
  </main>

  <script>
    // Điền API URL và Publishable key của dự án Supabase tại đây.
    const SUPABASE_URL = "https://xhgxxbjdidpkizxvrsfo.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_NcGKpKd7YSw9CnofZh1XCw_4qfOm71i";

    const loginSection = document.getElementById("loginSection");
    const homeSection = document.getElementById("homeSection");
    const loginMessage = document.getElementById("loginMessage");

    let supabaseClient = null;

    if (
      SUPABASE_URL.startsWith("https://") &&
      !SUPABASE_URL.includes("DAN_API_URL") &&
      SUPABASE_KEY.startsWith("sb_publishable_")
    ) {
      supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );
    } else {
      loginMessage.textContent =
        "Website đang chờ cấu hình thông tin kết nối Supabase.";
    }

    async function showUser(user) {
      if (!supabaseClient || !user) return;

      const { data, error } = await supabaseClient
        .from("profiles")
        .select("full_name, role, class_name")
        .eq("id", user.id)
        .single();

      if (error || !data) {
        loginMessage.textContent =
          "Tài khoản chưa có hồ sơ được cấp. Vui lòng liên hệ cô Thương.";
        return;
      }

      loginSection.classList.add("hidden");
      homeSection.classList.remove("hidden");

      document.getElementById("userName").textContent =
        data.full_name || user.email;

      document.getElementById("userRole").textContent =
        data.role === "teacher"
          ? "Tài khoản giáo viên"
          : "Tài khoản học sinh";

      document.getElementById("dashboardMessage").textContent =
        data.role === "teacher"
          ? "Chào cô Thương! Khu vực quản lý lớp học sẽ được hoàn thiện ở bước tiếp theo."
          : "Chào em! Khu vực bài học và bài tập sẽ được hoàn thiện ở bước tiếp theo.";
    }

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!supabaseClient) {
        loginMessage.textContent =
          "Chưa cấu hình kết nối. Hãy kiểm tra API URL và Publishable key.";
        return;
      }

      const button = document.getElementById("loginButton");
      button.disabled = true;
      button.textContent = "Đang đăng nhập...";
      loginMessage.textContent = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      button.disabled = false;
      button.textContent = "Đăng nhập";

      if (error) {
        loginMessage.textContent = "Đăng nhập chưa thành công: " + error.message;
        return;
      }

      await showUser(data.user);
    });

    document.getElementById("logoutButton").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      homeSection.classList.add("hidden");
      loginSection.classList.remove("hidden");
      loginMessage.textContent = "Em đã đăng xuất.";
    });

    async function checkSession() {
      if (!supabaseClient) return;
      const { data } = await supabaseClient.auth.getSession();
      if (data.session) await showUser(data.session.user);
    }

    checkSession();
  </script>
</body>
</html>
