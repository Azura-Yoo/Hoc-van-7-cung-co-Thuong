name: Validate Văn học số
on:
  push:
    branches: [main, van-hoc-so-homepage]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript and platform guards
        run: node scripts/validate-html.mjs
